name: swiftdo
description: "Aplicativo educacional da tarefas que possui um cronômetro Pomodoro e dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: 2.3.4+4
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0
  intl: ^0.20.2
  fl_chart: ^0.69.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  sqlite3: 2.9.4

flutter:
  generate: true
  uses-material-design: true
